name: Publication tests

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'test/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test test/*.test.cjs
      - run: bash -n scripts/publish-ranking.sh
